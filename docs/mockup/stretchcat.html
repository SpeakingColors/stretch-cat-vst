<style>
/* Whisker Scope, Studio 87. Layout: wood cheek | dark panel | wood cheek. Same house style as PurrOne. */
:root {
  --ground:#0b0b0d; --panel:#15161a; --panel-2:#1c1d22; --line:#2b2d34; --ink:#f4f5f7; --ink-dim:#a9adb8;

  color-scheme: dark;
}
* { box-sizing:border-box; }
body { margin:0; background:var(--ground); color:var(--ink); font-family:var(--f-label); font-size:15px; letter-spacing:.04em;
  padding-block:12px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); }
#desk { position:relative; width:100%; }
#frame { position:absolute; touch-action:none; }
#win { position:absolute; left:0; top:0; width:1400px; height:940px; transform-origin:0 0; }

.rz.n,.rz.s { left:18px; right:18px; height:10px; cursor:ns-resize; } .rz.n { top:-5px; } .rz.s { bottom:-5px; }
.rz.e,.rz.w { top:18px; bottom:18px; width:10px; cursor:ew-resize; } .rz.e { right:-5px; } .rz.w { left:-5px; }
.rz.ne,.rz.nw,.rz.se,.rz.sw { width:20px; height:20px; } .rz.ne { top:-6px; right:-6px; cursor:nesw-resize; } .rz.nw { top:-6px; left:-6px; cursor:nwse-resize; } .rz.se { bottom:-6px; right:-6px; cursor:nwse-resize; } .rz.sw { bottom:-6px; left:-6px; cursor:nesw-resize; }
.rz:hover,.rz.drag { background:#02EBBA55; border-radius:3px; }
.unit { width:1400px; height:940px; margin:0; display:grid; grid-template-columns:30px minmax(0,1fr) 30px; box-shadow:0 30px 80px #000c; border-radius:4px; overflow:hidden; }
.cheek { background:repeating-linear-gradient(92deg,#5B3A22 0 3px,#6E4729 3px 7px,#4E3120 7px 9px,#77502F 9px 14px); }

.panel { background:radial-gradient(ellipse at 50% 0%,#1e1f23 0%,var(--panel) 60%),var(--panel); padding:10px 14px 12px; display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; gap:10px; min-width:0; min-height:0; }
header.top { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:16px; align-items:center; padding-bottom:10px; border-bottom:1px solid var(--line); }
.brand { display:flex; align-items:center; gap:10px; }
.brand svg { width:38px; height:38px; }
.brand b { font-size:28px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; }

.pname { background:#0a0a0c; border:1px solid var(--line); border-radius:3px; padding:7px 12px; font-family:var(--f-num); font-size:14px; color:var(--ink); display:flex; justify-content:space-between; gap:8px; cursor:pointer; min-width:0; text-align:left; text-transform:none; letter-spacing:0; }

button,.btn { font:inherit; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink); background:var(--panel-2); border:1px solid var(--line); border-radius:3px; padding:7px 11px; cursor:pointer; font-size:13px; }

.viewcol { min-width:0; min-height:0; display:grid; grid-template-rows:auto minmax(0,1fr) auto; gap:8px; }
.tabs { display:flex; gap:6px; }

.kv { font-family:var(--f-num); font-size:12px; color:var(--cL); }

.foot { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; justify-content:space-between; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-dim); border-top:1px solid var(--line); padding-top:8px; }

.card ul { margin:0; padding-left:18px; display:grid; gap:3px; }
.card .row { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.card .set { display:flex; justify-content:space-between; align-items:center; gap:10px; }
a.btn { text-decoration:none; display:inline-block; }
a.btn[aria-disabled="true"] { opacity:.45; pointer-events:none; }
.tip { position:fixed; z-index:80; max-width:260px; background:#0a0a0c; border:1px solid #4a4d58; border-radius:4px; padding:7px 10px; font-size:13px; letter-spacing:.02em; pointer-events:none; box-shadow:0 8px 24px #000c; }
.tip b { display:block; font-size:12px; letter-spacing:.14em; text-transform:uppercase; color:var(--cL); margin-bottom:2px; }
.tip[hidden] { display:none; }
/* shapes page groups */
.sgrid { display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr); gap:8px; width:100%; }
.g3 { display:flex; flex-wrap:wrap; gap:6px 10px; align-items:flex-end; align-content:flex-start; border:1px solid var(--line); border-radius:4px; padding:7px 9px 8px; background:#121317; min-width:0; }
.g3.wide { grid-column:1 / -1; }
.g3 > .gh { flex:1 0 100%; display:flex; gap:8px; align-items:baseline; font-size:13px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink); }
.g3 > .gh i { font-style:normal; display:inline-grid; place-items:center; width:20px; height:20px; border-radius:50%; background:var(--cAcc); color:#111; font-weight:700; font-size:13px; letter-spacing:0; }
.g3 > .gh small { letter-spacing:.03em; text-transform:none; font-size:12.5px; color:var(--ink-dim); }
.g3 .st { font-family:var(--f-num); font-size:12px; color:var(--cAcc); letter-spacing:0; text-transform:none; }
.g3 .kw { width:76px; }
@media (prefers-reduced-motion:reduce) { * { transition:none !important; } }

[hidden] { display:none !important; }

.row2 { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
.sec { background:var(--panel-2); border:1px solid var(--line); border-radius:4px; padding:8px 10px; min-width:0; min-height:0; }
.sec > h3 { margin:0 0 6px; font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-dim); display:flex; justify-content:space-between; gap:8px; align-items:center; }
.cv { position:relative; background:var(--disp); border:1px solid var(--line); border-radius:4px; overflow:hidden; min-height:0; }
.cv canvas { position:absolute; inset:0; width:100%; height:100%; display:block; }
.dot { color:var(--cAcc); font-family:var(--f-num); font-size:12px; letter-spacing:0; }
.pbody { grid-template-rows:auto auto minmax(0,1fr); }

/* Studio 87 mockup kit: helpers, info bubbles, knobs, selects, toggles, resizable window, modals, presets, frame loop.

var $ = function (s, r) { return (r || document).querySelector(s); };
var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

var lerp = function (a, b, t) { return a + (b - a) * t; };
var dbOf = function (x) { return 20 * Math.log10(Math.max(x, 1e-9)); };
var lin = function (d) { return Math.pow(10, d / 20); };
function store(k, v) { try { if (v === undefined) return JSON.parse(localStorage.getItem(k)); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } }

var S = {}, DEF = {}, UI = {}, OPTS = {}, SET = { bubbles: true, eco: false };
(function () { var sv = store(KIT.key + ".settings.v1"); if (sv && typeof sv === "object") { SET.bubbles = sv.bubbles !== false; SET.eco = !!sv.eco; } })();
function saveSet() { store(KIT.key + ".settings.v1", SET); }
function def(id, v) { DEF[id] = v; S[id] = v; }

/* ---------- info bubbles (after 1 s of hovering) ---------- */
var tipEl = $("#tip"), tipTimer = null;
function attachTip(el, label, text) {
  if (!text) return;
  el.addEventListener("pointerenter", function () {
